# Hooks for developing this repo itself. After cloning, run:  pre-commit install
default_install_hook_types: [pre-commit, prepare-commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  # Dogfood: use the hook from this checkout.
  - repo: local
    hooks:
      - id: claude-commit-msg
        name: Claude commit message
        entry: scripts/claude-commit-msg.sh
        language: script
        stages: [prepare-commit-msg]
        always_run: true
