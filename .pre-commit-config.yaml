# Pre-commit hooks for this repository.
# After cloning, run:  pre-commit install --hook-type pre-commit --hook-type prepare-commit-msg

repos:
  # Generic hygiene hooks (normal pre-commit stage). Remove or extend as needed.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Claude Code writes a draft commit message from the staged diff.
  - repo: local
    hooks:
      - id: claude-commit-msg
        name: Claude commit message
        entry: scripts/claude-commit-msg.sh
        language: script
        stages: [prepare-commit-msg]
        always_run: true
